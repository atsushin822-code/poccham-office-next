name: build

# Poccham Office Next — 1 本のワークフローで「テスト → 全プラットフォームの
# インストーラ作成 → チェックサム → リリース添付」まで通します。
#
# 生成物
#   Windows : *-setup.exe (NSIS インストーラ) / *-portable.zip (単体 exe)
#   macOS   : *.dmg (Intel x86_64) / *.dmg (Apple Silicon aarch64)
#   Linux   : *.AppImage / *.deb / *.rpm
#   共通    : SHA256SUMS.txt

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 日本語のログをどの OS でもそのまま出せるようにする
  # (Windows ランナーの既定コードページは cp1252 で、これが無いと
  #  Python の print() が UnicodeEncodeError になります)
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # ローカルビルドと CI で同じ成果物名にするための基準バージョン
  APP_VERSION: 0.9.0

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------ tests
  test:
    name: テスト (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      # ソースがサブフォルダにネストしていても (zip をそのまま展開した場合など)
      # 以降のステップがリポジトリのルートで動くように正規化します。
      # ソースがリポジトリ直下に無い場合 (zip を展開したフォルダごと push した、
      # zip をそのままコミットした、など) に、自動でルートへ持ってきます。
      - name: ソースのルートを解決
        shell: bash
        run: |
          set -euo pipefail

          # 中身を $src からカレント (リポジトリのルート) へ移動する
          hoist() {
            local src="$1"
            shopt -s nullglob dotglob
            for entry in "${src}"/*; do
              local name
              name="$(basename "${entry}")"
              if [ -d "${entry}" ] && [ -d "${name}" ]; then
                # 既にあるフォルダ (.github など) は中身を統合する
                cp -R "${entry}"/. "${name}"/
                rm -rf "${entry}"
              else
                rm -rf "${name}"
                mv "${entry}" .
              fi
            done
            shopt -u nullglob dotglob
          }

          # 「[workspace] を持つ Cargo.toml」があるディレクトリを浅い順に探す
          find_source() {
            local f dir
            while IFS= read -r f; do
              if grep -q '\[workspace\]' "${f}" 2>/dev/null; then
                dirname "${f}"
                return 0
              fi
            done < <(find . -maxdepth 4 -name Cargo.toml \
                       -not -path "*/target/*" -not -path "./.git/*" | sort)
            return 1
          }

          resolve() {
            if [ -f Cargo.toml ]; then
              echo "OK: Cargo.toml はリポジトリのルートにあります"
              return 0
            fi
            local src
            if src="$(find_source)"; then
              echo "ソースを ${src} からルートへ移動します"
              hoist "${src}"
              # 空になった入れ子フォルダを片付ける
              find . -mindepth 1 -maxdepth 4 -type d -empty \
                -not -path "./.git/*" -not -path "*/target/*" -delete 2>/dev/null || true
              [ -f Cargo.toml ]
              return
            fi
            return 1
          }

          if resolve; then
            exit 0
          fi

          # zip がコミットされている場合はその場で展開して再挑戦する
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" -print -quit 2>/dev/null || true)
          if [ -n "${ZIP}" ]; then
            echo "${ZIP} をリポジトリ直下に展開します"
            if command -v unzip > /dev/null; then
              unzip -q -o "${ZIP}" -d . || true
            else
              tar -xf "${ZIP}" -C . || true
            fi
            if resolve; then
              exit 0
            fi
          fi

          echo "::error::Cargo.toml が見つかりませんでした。リポジトリ直下に Cargo.toml / crates / scripts を置くか、配布 zip をリポジトリ直下で展開してください。"
          echo "--- ルートの中身 ---"
          ls -la
          echo "--- Cargo.toml の場所 (深さ 4 まで) ---"
          find . -maxdepth 4 -name Cargo.toml -not -path "*/.git/*" -not -path "*/target/*" || true
          exit 1

      - name: Rust ツールチェーン
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: ビルド & ユニット/統合テスト
        run: cargo test --workspace --all-targets

      - name: 整形チェック
        run: cargo fmt --all -- --check

      - name: 静的解析 (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: CLI スモークテスト
        run: |
          set -euo pipefail
          cargo build --release -p poc-cli
          BIN=target/release/poc
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          WORK="$RUNNER_TEMP/poc-cli"
          mkdir -p "$WORK"
          "$BIN" version
          "$BIN" new "$WORK/report.xlsx"
          "$BIN" new "$WORK/memo.docx"
          "$BIN" new "$WORK/deck.pptx"
          "$BIN" info "$WORK/report.xlsx"
          "$BIN" convert "$WORK/report.xlsx" "$WORK/report.ods"
          "$BIN" convert "$WORK/report.ods" "$WORK/back.xlsx"
          "$BIN" calc "$WORK/back.xlsx"
          "$BIN" bench --cells 20000 > /dev/null

      - name: OOXML 互換性検証 (openpyxl / python-docx / python-pptx)
        run: |
          set -euo pipefail
          cargo build --release -p poc-cli
          BIN=target/release/poc
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          PY=$(command -v python3 || command -v python)
          # macOS / 最近の Linux のシステム Python は pip install できない
          # (PEP 668 externally-managed-environment) ので venv を作る。
          # 3 OS の bash から同じ相対パスで扱えるよう、カレント配下に作る。
          "$PY" -m venv .ci-venv
          VPY=".ci-venv/bin/python"
          if [ ! -x "$VPY" ]; then VPY=".ci-venv/Scripts/python.exe"; fi
          "$VPY" -m pip install --quiet --disable-pip-version-check \
            openpyxl python-docx python-pptx
          POC_BIN="$BIN" "$VPY" scripts/verify_ooxml.py
          rm -rf .ci-venv

      - name: UI スモークテスト (jsdom)
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock jsdom
          node scripts/ui_smoke_test.js

  # ------------------------------------------------------- desktop bundles
  bundle:
    name: パッケージ (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
          - label: macos-intel
            os: macos-15-intel      # GitHub で唯一の Intel (x86_64) ランナー
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"
          - label: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
          - label: linux-x64
            os: ubuntu-22.04        # glibc 2.35 / 古めのディストリでも動く基準
            target: x86_64-unknown-linux-gnu
            args: "--bundles appimage,deb,rpm"
    steps:
      - uses: actions/checkout@v4

      # ソースがサブフォルダにネストしていても (zip をそのまま展開した場合など)
      # 以降のステップがリポジトリのルートで動くように正規化します。
      - name: ソースのルートを解決
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ]; then
            echo "OK: Cargo.toml はリポジトリのルートにあります"
            exit 0
          fi
          shopt -s nullglob
          for d in */; do
            if [ -f "${d}Cargo.toml" ]; then
              echo "ネストしたフォルダ ${d} の内容をルートへ移動します"
              find "${d}" -mindepth 1 -maxdepth 1 -exec mv {} . \;
              rmdir "${d}"
              exit 0
            fi
          done
          echo "Cargo.toml が見つかりません。リポジトリ直下に Cargo.toml を置いてください。" >&2
          exit 1

      - name: Rust ツールチェーン
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/poc-ui/src-tauri -> target

      - name: Linux のビルド依存 (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev file rpm

      - name: Tauri でビルド & バンドル
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/poc-ui/src-tauri
          args: ${{ matrix.args }}

      # ---------------------------------------------------- Windows: portable
      - name: Windows ポータブル版を作成
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "crates/poc-ui/src-tauri/target/release" -Filter "*.exe" |
                 Where-Object { $_.Name -notmatch "setup|uninst" } | Select-Object -First 1
          if (-not $exe) { throw "exe が見つかりません" }
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item $exe.FullName "stage/Poccham Office Next.exe"
          Copy-Item README.md, LICENSE docs -Destination stage -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path stage/* -DestinationPath "Poccham-Office-Next-${{ env.APP_VERSION }}-windows-x64-portable.zip" -Force

      # ------------------------------------------------- 成果物を 1 箇所に集約
      - name: 成果物を集約
        run: |
          set -euo pipefail
          mkdir -p out
          B=crates/poc-ui/src-tauri/target/release/bundle
          for f in "$B"/nsis/*.exe "$B"/dmg/*.dmg "$B"/deb/*.deb "$B"/rpm/*.rpm "$B"/appimage/*.AppImage; do
            if [ -e "$f" ]; then cp -R "$f" out/; fi
          done
          for f in Poccham-Office-Next-*-portable.zip; do
            if [ -e "$f" ]; then cp "$f" out/; fi
          done
          ls -la out

      - name: チェックサム
        run: |
          set -euo pipefail
          cd out
          if command -v sha256sum > /dev/null; then sha256sum * > SHA256SUMS.txt; else shasum -a 256 * > SHA256SUMS.txt; fi
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- release
  release:
    name: リリース作成
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 全ファイルの SHA256 をまとめる
        run: |
          set -euo pipefail
          cd artifacts
          rm -f SHA256SUMS.txt
          sha256sum * | tee SHA256SUMS.txt

      - name: GitHub リリースへ添付
        uses: softprops/action-gh-release@v2
        with:
          name: Poccham Office Next ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/*
