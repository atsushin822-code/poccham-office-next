name: build

# Poccham Office Next — 1 本のワークフローで「テスト → 全プラットフォームの
# インストーラ作成 → チェックサム → リリース添付」まで通します。
#
# 生成物
#   Windows : *-setup.exe (NSIS インストーラ) / *-portable.zip (単体 exe)
#   macOS   : *.dmg (Intel x86_64) / *.dmg (Apple Silicon aarch64)
#   Linux   : *.AppImage / *.deb / *.rpm
#   共通    : SHA256SUMS.txt

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 日本語のログをどの OS でもそのまま出せるようにする
  # (Windows ランナーの既定コードページは cp1252 で、これが無いと
  #  Python の print() が UnicodeEncodeError になります)
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # ローカルビルドと CI で同じ成果物名にするための基準バージョン
  APP_VERSION: 0.9.0

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------ tests
  test:
    name: テスト (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: ソースのルートを解決
        shell: bash
        run: |
          set -euo pipefail
          echo "ソース解決ステップ: rev4"

          workspace_toml() { grep -q '\[workspace\]' "$1" 2>/dev/null; }

          find_source() {
            local f
            while IFS= read -r f; do
              if workspace_toml "${f}"; then dirname "${f}"; return 0; fi
            done < <(find . -maxdepth 6 -name Cargo.toml \
                       -not -path "./.git/*" -not -path "*/target/*" \
                       -not -path "*/node_modules/*" | sort)
            return 1
          }

          hoist() {
            local src="$1" entry name
            shopt -s nullglob dotglob
            for entry in "${src}"/*; do
              name="$(basename "${entry}")"
              if [ -d "${entry}" ] && [ -d "${name}" ]; then
                cp -R "${entry}"/. "${name}"/
                rm -rf "${entry}"
              else
                rm -rf "${name}"
                mv "${entry}" .
              fi
            done
            shopt -u nullglob dotglob
          }

          resolve() {
            if [ -f Cargo.toml ]; then
              echo "OK: Cargo.toml はリポジトリのルートにあります"
              return 0
            fi
            local src
            if ! src="$(find_source)"; then return 1; fi
            echo "ソースを ${src} からリポジトリのルートへ移動します"
            hoist "${src}"
            find . -mindepth 1 -maxdepth 6 -type d -empty \
              -not -path "./.git/*" -not -path "*/target/*" -delete 2>/dev/null || true
            if [ -f Cargo.toml ]; then return 0; fi
            return 1
          }

          if ! resolve; then
            ZIP=$(find . -maxdepth 3 -name "*.zip" -not -path "./.git/*" -print -quit 2>/dev/null || true)
            if [ -n "${ZIP}" ]; then
              echo "${ZIP} をリポジトリ直下に展開します"
              unzip -q -o "${ZIP}" -d . 2>/dev/null || tar -xf "${ZIP}" -C . || true
              resolve || true
            fi
          fi

          if [ ! -f Cargo.toml ]; then
            echo "::error::Cargo.toml が見つかりませんでした。配布 zip の中身をリポジトリ直下に置いてください。"
            echo "--- ルートの中身 ---"
            ls -la
            echo "--- リポジトリのツリー (深さ 2) ---"
            find . -maxdepth 2 -not -path "./.git*" | head -60
            echo "--- Cargo.toml の場所 (深さ 6) ---"
            find . -maxdepth 6 -name Cargo.toml -not -path "./.git/*" || true
            exit 1
          fi

          echo "ソースのルート: $(pwd)"
      - name: Rust ツールチェーン
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: ワークフロー定義の一貫性チェック
        run: python3 scripts/ci/check_workflow.py

      - name: ビルド & ユニット/統合テスト
        run: cargo test --workspace --all-targets

      - name: 整形チェック
        run: cargo fmt --all -- --check

      - name: 静的解析 (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: CLI スモークテスト
        run: |
          set -euo pipefail
          cargo build --release -p poc-cli
          BIN=target/release/poc
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          WORK="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/poc-cli"
          mkdir -p "$WORK"
          "$BIN" version
          "$BIN" new "$WORK/report.xlsx"
          "$BIN" new "$WORK/memo.docx"
          "$BIN" new "$WORK/deck.pptx"
          "$BIN" info "$WORK/report.xlsx"
          "$BIN" convert "$WORK/report.xlsx" "$WORK/report.ods"
          "$BIN" convert "$WORK/report.ods" "$WORK/back.xlsx"
          "$BIN" calc "$WORK/back.xlsx"
          "$BIN" bench --cells 20000 > /dev/null

      - name: OOXML 互換性検証 (openpyxl / python-docx / python-pptx)
        run: |
          set -euo pipefail
          cargo build --release -p poc-cli
          BIN=target/release/poc
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          PY=$(command -v python3 || command -v python)
          # macOS / 最近の Linux のシステム Python は pip install できない
          # (PEP 668 externally-managed-environment) ので venv を作る。
          # 3 OS の bash から同じ相対パスで扱えるよう、カレント配下に作る。
          "$PY" -m venv .ci-venv
          VPY=".ci-venv/bin/python"
          if [ ! -x "$VPY" ]; then VPY=".ci-venv/Scripts/python.exe"; fi
          "$VPY" -m pip install --quiet --disable-pip-version-check \
            openpyxl python-docx python-pptx
          POC_BIN="$BIN" "$VPY" scripts/verify_ooxml.py
          rm -rf .ci-venv

      - name: UI スモークテスト (jsdom)
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock jsdom
          node scripts/ui_smoke_test.js

  # ------------------------------------------------------- desktop bundles
  bundle:
    name: パッケージ (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
          - label: macos-intel
            os: macos-15-intel      # GitHub で唯一の Intel (x86_64) ランナー
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"
          - label: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
          - label: linux-x64
            os: ubuntu-22.04        # glibc 2.35 / 古めのディストリでも動く基準
            target: x86_64-unknown-linux-gnu
            args: "--bundles appimage,deb,rpm"
    steps:
      - uses: actions/checkout@v4

      - name: ソースのルートを解決
        shell: bash
        run: |
          set -euo pipefail
          echo "ソース解決ステップ: rev4"

          workspace_toml() { grep -q '\[workspace\]' "$1" 2>/dev/null; }

          find_source() {
            local f
            while IFS= read -r f; do
              if workspace_toml "${f}"; then dirname "${f}"; return 0; fi
            done < <(find . -maxdepth 6 -name Cargo.toml \
                       -not -path "./.git/*" -not -path "*/target/*" \
                       -not -path "*/node_modules/*" | sort)
            return 1
          }

          hoist() {
            local src="$1" entry name
            shopt -s nullglob dotglob
            for entry in "${src}"/*; do
              name="$(basename "${entry}")"
              if [ -d "${entry}" ] && [ -d "${name}" ]; then
                cp -R "${entry}"/. "${name}"/
                rm -rf "${entry}"
              else
                rm -rf "${name}"
                mv "${entry}" .
              fi
            done
            shopt -u nullglob dotglob
          }

          resolve() {
            if [ -f Cargo.toml ]; then
              echo "OK: Cargo.toml はリポジトリのルートにあります"
              return 0
            fi
            local src
            if ! src="$(find_source)"; then return 1; fi
            echo "ソースを ${src} からリポジトリのルートへ移動します"
            hoist "${src}"
            find . -mindepth 1 -maxdepth 6 -type d -empty \
              -not -path "./.git/*" -not -path "*/target/*" -delete 2>/dev/null || true
            if [ -f Cargo.toml ]; then return 0; fi
            return 1
          }

          if ! resolve; then
            ZIP=$(find . -maxdepth 3 -name "*.zip" -not -path "./.git/*" -print -quit 2>/dev/null || true)
            if [ -n "${ZIP}" ]; then
              echo "${ZIP} をリポジトリ直下に展開します"
              unzip -q -o "${ZIP}" -d . 2>/dev/null || tar -xf "${ZIP}" -C . || true
              resolve || true
            fi
          fi

          if [ ! -f Cargo.toml ]; then
            echo "::error::Cargo.toml が見つかりませんでした。配布 zip の中身をリポジトリ直下に置いてください。"
            echo "--- ルートの中身 ---"
            ls -la
            echo "--- リポジトリのツリー (深さ 2) ---"
            find . -maxdepth 2 -not -path "./.git*" | head -60
            echo "--- Cargo.toml の場所 (深さ 6) ---"
            find . -maxdepth 6 -name Cargo.toml -not -path "./.git/*" || true
            exit 1
          fi

          echo "ソースのルート: $(pwd)"
      - name: Rust ツールチェーン
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/poc-ui/src-tauri -> target

      - name: Linux のビルド依存 (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev file rpm

      - name: Tauri でビルド & バンドル
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/poc-ui/src-tauri
          args: ${{ matrix.args }}

      # ---------------------------------------------------- Windows: portable
      - name: Windows ポータブル版を作成
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "crates/poc-ui/src-tauri/target"
          $exe = Get-ChildItem -Path $target -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match "[\\/]release[\\/]" -and
                                $_.FullName -notmatch "[\\/]bundle[\\/]" -and
                                $_.Name -notmatch "setup|uninst" } |
                 Sort-Object LastWriteTime -Descending |
                 Select-Object -First 1
          if (-not $exe) { throw "exe が見つかりません (探した場所: $target)" }
          Write-Host "同梱する exe: $($exe.FullName)"

          Remove-Item -Path stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Path $exe.FullName -Destination "stage/Poccham Office Next.exe" -Force

          # パスは 1 つずつ渡す（カンマ区切り＋位置引数は PowerShell が
          # "A positional parameter cannot be found" で失敗する原因になる）
          foreach ($item in @("README.md", "LICENSE", "docs", "NOTICE")) {
            if (Test-Path -LiteralPath $item) {
              Copy-Item -Path $item -Destination stage -Recurse -Force
            }
          }
          Get-ChildItem -Path stage | Select-Object Name, Length

          $zip = "Poccham-Office-Next-${env:APP_VERSION}-${{ matrix.label }}-portable.zip"
          Compress-Archive -Path "stage/*" -DestinationPath $zip -Force
          if (-not (Test-Path -LiteralPath $zip)) { throw "ポータブル zip を作成できませんでした" }
          Get-Item -LiteralPath $zip | Select-Object Name, Length

      # ------------------------------------------------- 成果物を 1 箇所に集約
      - name: 成果物を集約
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # `--target <triple>` を付けると出力先は target/<triple>/release/bundle に
          # 変わるため、パスを決め打ちせずリポジトリ全体から拾います。
          find . -path ./.git -prune -o -path ./out -prune -o -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name 'Poccham-Office-Next-*-portable.zip' \) -print0 |
          while IFS= read -r -d '' f; do
            case "${f}" in
              */bundle/*|*portable.zip) cp -f "${f}" out/ ;;
            esac
          done
          ls -la out
          if [ -z "$(ls -A out)" ]; then
            echo "::error::バンドル成果物が見つかりませんでした（Tauri のビルド結果が空です）。"
            echo "--- bundle ディレクトリ ---"
            find . -type d -name bundle -not -path "./.git/*" | head -20 || true
            echo "--- target 配下の release ディレクトリ ---"
            find . -type d -path "*target*" -name release -not -path "./.git/*" | head -20 || true
            exit 1
          fi

      - name: チェックサム
        shell: bash
        run: |
          set -euo pipefail
          cd out
          if [ -z "$(ls -A)" ]; then
            echo "::error::out が空です（成果物を集約するステップを確認してください）。"
            ls -la
            exit 1
          fi
          SUM="SHA256SUMS-${{ matrix.label }}.txt"
          set -- *
          if command -v sha256sum > /dev/null 2>&1; then sha256sum "$@" > "${SUM}"; else shasum -a 256 "$@" > "${SUM}"; fi
          cat "${SUM}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- release
  release:
    name: リリース作成
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 全ファイルの SHA256 をまとめる
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          rm -f SHA256SUMS.txt
          if [ -z "$(ls -A)" ]; then
            echo "::error::ダウンロードした成果物がありません。"
            exit 1
          fi
          : > SHA256SUMS.txt
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in SHA256SUMS*.txt) continue ;; esac   # 各ジョブの控えは除外
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: GitHub リリースへ添付
        uses: softprops/action-gh-release@v2
        with:
          name: Poccham Office Next ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/*
